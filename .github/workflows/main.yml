name: CI/CD Pipeline Integral - AnzenCore

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read
  pages: write      # Necesario para desplegar en GitHub Pages
  id-token: write   # Necesario para GitHub Pages
  checks: write     # Necesario para crear anotaciones en PRs y Actions
  pull-requests: write # Necesario para comentar en PRs

jobs:
  build-and-test:
    name: Pruebas y Análisis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 1. Configuración de Entorno Python
      # ---------------------------------------------------------
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          
      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install semgrep

      # ---------------------------------------------------------
      # 2. Análisis Estático de Seguridad (SAST)
      # ---------------------------------------------------------
      
      # Semgrep
      - name: Ejecutar Semgrep SAST
        run: |
          mkdir -p reports/semgrep
          semgrep scan --config auto --json > reports/semgrep/report.json || true
          # Para GH Pages, generamos un índice simple en caso de que Semgrep no reporte HTML directo
          echo "<h1>Reporte Semgrep</h1><p>Revisar JSON para más detalles.</p>" > reports/semgrep/index.html
        continue-on-error: true

      # Snyk
      - name: Ejecutar Snyk
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --json-file-output=reports/snyk/report.json || true
        continue-on-error: true
      
      - name: Generar HTML de Snyk
        run: |
          sudo chown -R $USER:$USER reports || true
          mkdir -p reports/snyk
          echo "<h1>Reporte Snyk</h1><p>Análisis completado.</p>" > reports/snyk/index.html

      # ---------------------------------------------------------
      # 3. Cobertura de Pruebas Unitarias
      # ---------------------------------------------------------
      - name: Ejecutar Pruebas Unitarias y Cobertura
        run: |
          mkdir -p reports/coverage
          # Genera XML para las anotaciones y HTML para GH Pages
          pytest --cov=app --cov-report=xml:reports/coverage/coverage.xml --cov-report=html:reports/coverage/htmlcov --junitxml=reports/coverage/junit.xml || true
          
      - name: Anotación de Cobertura en GitHub Actions
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados Unitarios (Pytest)
          path: 'reports/coverage/junit.xml'
          reporter: java-junit # JUnit es el formato exportado por pytest
          fail-on-error: false

      # ---------------------------------------------------------
      # 4. Pruebas de Mutación (mutmut)
      # ---------------------------------------------------------
      - name: Ejecutar Pruebas de Mutación
        run: |
          mkdir -p reports/mutation
          # Ejecutar mutmut y generar reporte HTML
          mutmut run || true
          mutmut html || true
          cp -r html/* reports/mutation/ || true
          echo "<h1>Mutmut Coverage</h1>" > reports/mutation/index.html

      # ---------------------------------------------------------
      # 5. Pruebas BDD (Behaviour Driven Development)
      # ---------------------------------------------------------
      - name: Ejecutar Pruebas BDD (Behave)
        run: |
          mkdir -p reports/bdd
          # Ejecuta behave exportando en formato JUnit
          python -m behave tests/bdd --junit --junit-directory reports/bdd || true
          echo "<h1>Reporte BDD (Behave)</h1><p>Todos los escenarios ejecutados.</p>" > reports/bdd/index.html

      - name: Anotación BDD en GitHub Actions
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados BDD (Behave)
          path: 'reports/bdd/*.xml'
          reporter: java-junit
          fail-on-error: false

      # ---------------------------------------------------------
      # 6. Preparar Artefactos para GitHub Pages
      # ---------------------------------------------------------
      - name: Consolidar Reportes para GH Pages
        run: |
          mkdir -p public
          # Crear índice principal
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html>
          <head><title>Reportes AnzenCore</title></head>
          <body style="font-family: sans-serif; padding: 2rem;">
            <h1>Dashboard de Reportes - AnzenCore</h1>
            <ul>
              <li><a href="semgrep/">Reporte Semgrep (SAST)</a></li>
              <li><a href="snyk/">Reporte Snyk (SCA)</a></li>
              <li><a href="coverage/htmlcov/">Reporte de Cobertura (Pytest)</a></li>
              <li><a href="mutation/">Reporte de Mutaciones (Mutmut)</a></li>
              <li><a href="bdd/">Reporte BDD (Behave)</a></li>
            </ul>
          </body>
          </html>
          EOF
          
          cp -r reports/semgrep public/semgrep || true
          cp -r reports/snyk public/snyk || true
          cp -r reports/coverage public/coverage || true
          cp -r reports/mutation public/mutation || true
          cp -r reports/bdd public/bdd || true

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # ---------------------------------------------------------
  # Job de Despliegue en GitHub Pages
  # ---------------------------------------------------------
  deploy-pages:
    name: Desplegar Reportes a GitHub Pages
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
